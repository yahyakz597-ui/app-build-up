name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon + splash (optional)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#03050b" --iconBackgroundColorDark "#03050b" --splashBackgroundColor "#03050b" --splashBackgroundColorDark "#03050b"

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LevelUp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LevelUp-Android
          path: LevelUp.apk
